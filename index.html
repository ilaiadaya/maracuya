<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>maracuya.chat — Ilai Bachrach</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #globe-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .overlay {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      pointer-events: none;
    }

    .container {
      max-width: 560px;
      width: 100%;
      text-align: center;
      pointer-events: auto;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.25rem;
      letter-spacing: -0.02em;
    }

    h1 span {
      color: #f5a623;
    }

    .subtitle {
      font-size: 1.05rem;
      color: #777;
      margin-bottom: 3rem;
    }

    .projects {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 3rem;
    }

    .project {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.25rem;
      background: rgba(21, 21, 21, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.25s, background 0.25s, transform 0.2s;
    }

    .project:hover {
      border-color: #f5a623;
      background: rgba(30, 30, 30, 0.9);
      transform: translateY(-2px);
    }

    .project-icon {
      font-size: 1.6rem;
      flex-shrink: 0;
      width: 2.5rem;
      text-align: center;
    }

    .project-info {
      text-align: left;
    }

    .project-name {
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
    }

    .project-desc {
      font-size: 0.82rem;
      color: #666;
      margin-top: 0.1rem;
    }

    .contact {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
    }

    .contact a {
      color: #555;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .contact a:hover {
      color: #f5a623;
    }

    @media (max-width: 500px) {
      h1 { font-size: 2rem; }
      .project { padding: 0.85rem 1rem; }
    }
  </style>
</head>
<body>
  <canvas id="globe-canvas"></canvas>

  <div class="overlay">
    <div class="container">
      <h1>maracuya<span>.chat</span></h1>
      <p class="subtitle">Building things — Ilai Bachrach</p>

      <div class="contact">
        <a href="mailto:ilaibachrach@gmail.com">email</a>
        <a href="https://x.com/ilaiadaya">x.com</a>
        <a href="https://github.com/ilaiadaya">github</a>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('globe-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.z = 3.2;

    // Globe
    const RADIUS = 1;
    const globeGeo = new THREE.SphereGeometry(RADIUS, 64, 64);
    const globeMat = new THREE.MeshStandardMaterial({
      color: 0x111111,
      roughness: 0.7,
      metalness: 0.3,
      transparent: true,
      opacity: 0.6,
    });
    const globe = new THREE.Mesh(globeGeo, globeMat);
    scene.add(globe);

    // Wireframe overlay
    const wireMat = new THREE.MeshBasicMaterial({
      color: 0xf5a623,
      wireframe: true,
      transparent: true,
      opacity: 0.06,
    });
    const wire = new THREE.Mesh(new THREE.SphereGeometry(RADIUS * 1.002, 32, 32), wireMat);
    scene.add(wire);

    // Dots on the globe (simulated cities)
    const dotGroup = new THREE.Group();
    scene.add(dotGroup);

    const cities = [
      [40.7, -74.0], [51.5, -0.1], [35.7, 139.7], [-33.9, 18.4],
      [48.9, 2.35], [-23.5, -46.6], [55.75, 37.6], [1.35, 103.8],
      [19.4, -99.1], [37.57, 127.0], [28.6, 77.2], [-34.6, -58.4],
      [30.0, 31.2], [25.2, 55.3], [39.9, 116.4], [34.1, -118.2],
      [22.3, 114.2], [13.75, 100.5], [41.0, 29.0], [59.3, 18.1],
    ];

    function latLonToVec3(lat, lon, r) {
      const phi = (90 - lat) * (Math.PI / 180);
      const theta = (lon + 180) * (Math.PI / 180);
      return new THREE.Vector3(
        -r * Math.sin(phi) * Math.cos(theta),
        r * Math.cos(phi),
        r * Math.sin(phi) * Math.sin(theta)
      );
    }

    const dotGeo = new THREE.SphereGeometry(0.012, 8, 8);
    const dotMat = new THREE.MeshBasicMaterial({ color: 0xf5a623 });

    cities.forEach(([lat, lon]) => {
      const pos = latLonToVec3(lat, lon, RADIUS * 1.01);
      const dot = new THREE.Mesh(dotGeo, dotMat);
      dot.position.copy(pos);
      dotGroup.add(dot);
    });

    // Arcs between some cities
    const arcGroup = new THREE.Group();
    scene.add(arcGroup);

    const connections = [
      [0, 1], [0, 5], [1, 3], [2, 7], [4, 6],
      [8, 11], [9, 14], [10, 7], [12, 13], [15, 8],
      [2, 16], [17, 7], [18, 6], [19, 1],
    ];

    connections.forEach(([i, j]) => {
      const start = latLonToVec3(cities[i][0], cities[i][1], RADIUS * 1.01);
      const end = latLonToVec3(cities[j][0], cities[j][1], RADIUS * 1.01);
      const mid = start.clone().add(end).multiplyScalar(0.5);
      const dist = start.distanceTo(end);
      mid.normalize().multiplyScalar(RADIUS + dist * 0.35);

      const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
      const points = curve.getPoints(40);
      const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
      const lineMat = new THREE.LineBasicMaterial({
        color: 0xf5a623,
        transparent: true,
        opacity: 0.15,
      });
      arcGroup.add(new THREE.Line(lineGeo, lineMat));
    });

    // Atmospheric glow
    const glowGeo = new THREE.SphereGeometry(RADIUS * 1.15, 32, 32);
    const glowMat = new THREE.ShaderMaterial({
      transparent: true,
      side: THREE.BackSide,
      uniforms: {
        glowColor: { value: new THREE.Color(0xf5a623) },
      },
      vertexShader: `
        varying vec3 vNormal;
        void main() {
          vNormal = normalize(normalMatrix * normal);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying vec3 vNormal;
        uniform vec3 glowColor;
        void main() {
          float intensity = pow(0.6 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 3.0);
          gl_FragColor = vec4(glowColor, intensity * 0.15);
        }
      `,
    });
    scene.add(new THREE.Mesh(glowGeo, glowMat));

    // Particles around globe
    const particleCount = 300;
    const particleGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount; i++) {
      const r = RADIUS + 0.15 + Math.random() * 0.8;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = r * Math.cos(phi);
      positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const particleMat = new THREE.PointsMaterial({
      color: 0xf5a623,
      size: 0.008,
      transparent: true,
      opacity: 0.5,
    });
    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.3));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 3, 5);
    scene.add(dirLight);

    // Mouse interaction
    let mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    // Animate
    function animate() {
      requestAnimationFrame(animate);

      const baseRotation = Date.now() * 0.0001;
      globe.rotation.y = baseRotation + mouseX * 0.3;
      globe.rotation.x = mouseY * 0.15;
      wire.rotation.copy(globe.rotation);
      dotGroup.rotation.copy(globe.rotation);
      arcGroup.rotation.copy(globe.rotation);
      particles.rotation.y = baseRotation * 0.5;

      renderer.render(scene, camera);
    }
    animate();

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
